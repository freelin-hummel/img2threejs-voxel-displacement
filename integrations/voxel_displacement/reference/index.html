<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>img2threejs voxel displacement reference</title>
    <style>
      :root { color-scheme: dark; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      html, body { margin: 0; min-height: 100%; background: #10141c; }
      body { overflow: hidden; }
      canvas { display: block; width: 100vw; height: 100vh; }
      #status { position: fixed; top: 12px; left: 12px; padding: 8px 10px; border: 1px solid #334155;
        border-radius: 6px; background: #10141cdd; color: #dbeafe; font-size: 12px; }
    </style>
    <script type="importmap">
      { "imports": { "three": "https://unpkg.com/three@0.185.1/build/three.module.js" } }
    </script>
  </head>
  <body>
    <div id="status">loading voxel reference…</div>
    <script type="module">
      import * as THREE from "three";
      import { createVoxelReferenceScene } from "./scene.js";

      const status = document.querySelector("#status");
      const params = new URLSearchParams(location.search);
      let artifact;
      const asset = params.get("asset");
      if (asset) {
        try {
          const response = await fetch(asset);
          if (!response.ok) throw new Error(`asset HTTP ${response.status}`);
          artifact = await response.json();
        } catch (error) {
          status.textContent = `asset failed: ${error.message}`;
        }
      }
      const result = await createVoxelReferenceScene({
        width: innerWidth,
        height: innerHeight,
        props: artifact ? { artifact } : {},
      });
      const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      document.body.append(renderer.domElement);
      const clock = new THREE.Clock();
      const resize = () => {
        result.camera.aspect = innerWidth / Math.max(1, innerHeight);
        result.camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      };
      addEventListener("resize", resize);
      const frame = () => {
        result.scene.rotation.y = clock.getElapsedTime() * 0.18;
        renderer.render(result.scene, result.camera);
        requestAnimationFrame(frame);
      };
      status.textContent = artifact ? "loaded VXD artifact · final-cell proxy" : "demo VXD · final-cell proxy";
      window.__IMG2THREEJS_VOXEL_REFERENCE_READY__ = true;
      frame();
    </script>
  </body>
</html>
